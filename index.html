<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TVCOM - Tu Televisión Abierta y Gratis</title>
    <style>
        body {
            background-color: #111;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            width: 100%;
            background-color: #000;
            padding: 15px 0;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #e50914;
            border-bottom: 2px solid #222;
        }
        #player-container {
            width: 100%;
            max-width: 800px;
            margin: 20px 0;
            background-color: black;
            aspect-ratio: 16/9;
        }
        video {
            width: 100%;
            height: 100%;
        }
        #channels-container {
            width: 90%;
            max-width: 800px;
            background-color: #1a1a1a;
            border-radius: 8px;
            padding: 15px;
            box-sizing: border-box;
            max-height: 400px;
            overflow-y: auto;
        }
        .channel-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #333;
            cursor: pointer;
            transition: background 0.2s;
        }
        .channel-item:hover {
            background-color: #333;
        }
        .channel-logo {
            width: 45px;
            height: 45px;
            object-fit: contain;
            margin-right: 15px;
            background: #222;
            border-radius: 4px;
        }
        .channel-info {
            display: flex;
            flex-direction: column;
        }
        .channel-name {
            font-weight: bold;
            font-size: 16px;
        }
        .channel-dial {
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>

    <header>TVCOM</header>

    <div id="player-container">
        <video id="video" controls autoplay muted></video>
    </div>

    <div id="channels-container">
        <h3>Guía de Canales</h3>
        <div id="playlist">Cargando canales instantáneamente...</div>
    </div>

    <!-- Cargamos el reproductor de forma asíncrona para que NO ralentice la carga de la web -->
    <script src="https://cloudflare.com" async defer></script>

    <script>
        // Leemos tu lista.m3u local alojada en tu mismo GitHub
        const m3uUrl = 'lista.m3u';
        const video = document.getElementById('video');
        const playlistContainer = document.getElementById('playlist');
        let hlsInstance = null;

        function playChannel(url) {
            // Esperamos un instante si Hls.js aún se está descargando en segundo plano
            if (typeof Hls !== 'undefined' && Hls.isSupported()) {
                if (hlsInstance) {
                    hlsInstance.destroy();
                }
                hlsInstance = new Hls();
                hlsInstance.loadSource(url);
                hlsInstance.attachMedia(video);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play().catch(e => console.log("Auto-play bloqueado, requiere interacción"));
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.play().catch(e => console.log("Auto-play bloqueado"));
            } else {
                // Si la web carga antes que el script, reintentamos en medio segundo
                setTimeout(() => playChannel(url), 500);
            }
        }

        async function loadPlaylist() {
            try {
                const response = await fetch(m3uUrl);
                if (!response.ok) throw new Error("No se pudo cargar el archivo lista.m3u");
                const text = await response.text();
                
                const lines = text.split('\n');
                let channels = [];
                let currentChannel = null;

                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (line.startsWith('#EXTINF:')) {
                        const chnoMatch = line.match(/tvg-chno="([^"]+)"/);
                        const logoMatch = line.match(/tvg-logo="([^"]+)"/);
                        const nameParts = line.split(',');
                        const name = nameParts[nameParts.length - 1].trim();

                        currentChannel = {
                            dial: chnoMatch ? chnoMatch[1] : (channels.length + 1),
                            logo: logoMatch ? logoMatch[1] : 'https://placeholder.com',
                            name: name
                        };
                    } else if (line.startsWith('http') && currentChannel) {
                        currentChannel.url = line;
                        channels.push(currentChannel);
                        currentChannel = null;
                    }
                }

                playlistContainer.innerHTML = '';
                if (channels.length === 0) {
                    playlistContainer.innerHTML = 'No se encontraron canales válidos en lista.m3u.';
                    return;
                }

                channels.forEach((channel, index) => {
                    const item = document.createElement('div');
                    item.className = 'channel-item';
                    item.innerHTML = `
                        <img class="channel-logo" src="${channel.logo}" onerror="this.src='https://placeholder.com'">
                        <div class="channel-info">
                            <span class="channel-name">${channel.name}</span>
                            <span class="channel-dial">Dial ${channel.dial}</span>
                        </div>
                    `;
                    item.addEventListener('click', () => playChannel(channel.url));
                    playlistContainer.appendChild(item);

                    if (index === 0) {
                        playChannel(channel.url);
                    }
                });

            } catch (error) {
                playlistContainer.innerHTML = 'Error: Asegúrate de haber subido el archivo "lista.m3u" a tu repositorio.';
                console.error(error);
            }
        }

        // Ejecutar carga inmediata al abrir la página
        window.addEventListener('DOMContentLoaded', loadPlaylist);
    </script>
</body>
</html>
