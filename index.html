<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TVCOM - Televisión Pura</title>

    <!-- Cargamos los iconos minimalistas y estables desde CDN -->
    <link rel="stylesheet" href="https://cloudflare.com">

    <style>
        :root {
            --glass-bg: rgba(10, 10, 15, 0.4);
            --glass-border: rgba(255, 255, 255, 0.06);
            --accent: #ff002b;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            user-select: none;
        }

        /* REPRODUCTOR A PANTALLA COMPLETA TOTAL */
        .fullscreen-theater {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Cambia a contain si prefieres barras negras laterales */
        }

        /* BOTONES FLOTANTES DE ZAPEO (FLECHAS TRANSPARENTES) */
        .zap-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 5;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--glass-border);
            color: rgba(255, 255, 255, 0.6);
            width: 50px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            border-radius: 0 8px 8px 0;
        }

        .zap-btn:hover {
            background: rgba(255, 0, 43, 0.3);
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 0, 43, 0.2);
        }

        #zap-next {
            right: 0;
            border-radius: 8px 0 0 8px;
        }

        /* BOTÓN DE MENÚ MÁSTER */
        .menu-trigger {
            position: absolute;
            top: 25px;
            right: 25px;
            z-index: 5;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .menu-trigger:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: rotate(90deg);
        }

        /* BANNER INFORMATIVO TEMPORAL (OSD DE ZAPEO) */
        .channel-overlay-banner {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(30px);
            z-index: 6;
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            padding: 15px 30px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            gap: 20px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .channel-overlay-banner.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .overlay-logo {
            width: 50px;
            height: 50px;
            object-fit: contain;
            background: #000;
            border-radius: 6px;
            padding: 4px;
        }

        .overlay-num {
            font-size: 26px;
            font-weight: 800;
            color: var(--accent);
        }

        .overlay-title {
            font-size: 18px;
            font-weight: 700;
        }

        /* LISTA LATERAL TRANSLÚCIDA Y RÁPIDA */
        .side-panel {
            position: absolute;
            top: 0;
            right: -350px;
            width: 330px;
            height: 100%;
            background: rgba(8, 8, 12, 0.75);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-left: 1px solid var(--glass-border);
            z-index: 10;
            transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            padding: 30px 20px;
        }

        .side-panel.open {
            right: 0;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .panel-header h2 {
            margin: 0;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .close-panel {
            cursor: pointer;
            font-size: 18px;
            color: rgba(255,255,255,0.5);
        }

        .channel-list-scroller {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .channel-list-scroller::-webkit-scrollbar {
            width: 3px;
        }

        .channel-list-scroller::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.1);
        }

        .list-row {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s;
        }

        .list-row:hover {
            background: rgba(255,255,255,0.05);
        }

        .list-row.active {
            background: rgba(255, 0, 43, 0.1);
            border-color: var(--accent);
        }

        .list-num {
            font-size: 14px;
            font-weight: 700;
            color: rgba(255,255,255,0.3);
            width: 30px;
        }

        .list-row.active .list-num {
            color: var(--accent);
        }

        .list-logo {
            width: 35px;
            height: 35px;
            object-fit: contain;
            background: #000;
            border-radius: 4px;
            padding: 2px;
        }

        .list-name {
            font-size: 14px;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <!-- REPRODUCTOR MÁSTER -->
    <div class="fullscreen-theater">
        <video id="video" controls autoplay muted></video>
    </div>

    <!-- CONTROLES TRANSPARENTES FLOTANTES -->
    <div class="zap-btn" id="zap-prev">
        <i class="fa-solid fa-chevron-left"></i>
    </div>

    <div class="zap-btn" id="zap-next">
        <i class="fa-solid fa-chevron-right"></i>
    </div>

    <div class="menu-trigger" id="open-menu">
        <i class="fa-solid fa-bars"></i>
    </div>

    <!-- BANNER TEMPORAL DE ZAPEO (OSD) -->
    <div class="channel-overlay-banner" id="osd">
        <div class="overlay-num" id="osd-num">101</div>

        <img
            class="overlay-logo"
            id="osd-logo"
            src=""
            alt="logo"
        >

        <div class="overlay-title" id="osd-name">
            Canal
        </div>
    </div>

    <!-- MENÚ LATERAL TRANSLÚCIDO -->
    <div class="side-panel" id="panel">

        <div class="panel-header">
            <h2>TVCOM</h2>

            <div class="close-panel" id="close-menu">
                <i class="fa-solid fa-xmark"></i>
            </div>
        </div>

        <div class="channel-list-scroller" id="box-list">
            <!-- Listas dinámicas -->
        </div>

    </div>

    <!-- Enlace directo al motor de streaming rápido desde CDN estable -->
    <script src="https://cloudflare.com"></script>

    <script>
        const m3uUrl = 'lista.m3u';
        const video = document.getElementById('video');

        let channels = [];
        let currentIndex = 0;
        let hlsInstance = null;
        let osdTimeout = null;

        // Mostrar OSD temporal al cambiar de canal
        function triggerOSD(channel) {
            document.getElementById('osd-num').innerText =
                channel.dial;

            document.getElementById('osd-logo').src =
                channel.logo;

            document.getElementById('osd-name').innerText =
                channel.name;

            const osd = document.getElementById('osd');

            osd.classList.add('show');

            clearTimeout(osdTimeout);

            osdTimeout = setTimeout(
                () => osd.classList.remove('show'),
                3000
            );
        }

        // Sintonizar Canal
        function sintonizar(index) {
            if (channels.length === 0) return;

            if (index < 0) {
                index = channels.length - 1;
            }

            if (index >= channels.length) {
                index = 0;
            }

            currentIndex = index;

            const channel = channels[currentIndex];

            triggerOSD(channel);

            // Marcar activo en el menú lateral
            document
                .querySelectorAll('.list-row')
                .forEach(r => r.classList.remove('active'));

            const activeRow =
                document.getElementById(`row-${channel.dial}`);

            if (activeRow) {
                activeRow.classList.add('active');
            }

            // Carga y reproducción de flujo hls (.m3u8)
            if (
                typeof Hls !== 'undefined' &&
                Hls.isSupported()
            ) {
                if (hlsInstance) {
                    hlsInstance.destroy();
                }

                hlsInstance = new Hls();

                hlsInstance.loadSource(channel.url);
                hlsInstance.attachMedia(video);

                hlsInstance.on(
                    Hls.Events.MANIFEST_PARSED,
                    () => video.play().catch(() => {})
                );

            } else if (
                video.canPlayType(
                    'application/vnd.apple.mpegurl'
                )
            ) {
                video.src = channel.url;

                video.play().catch(() => {});
            }
        }

        // Parseador del M3U local
        async function loadTVCOM() {
            try {
                const response = await fetch(m3uUrl);

                const text = await response.text();

                const lines = text.split('\n');

                let currentChannel = null;

                for (
                    let i = 0;
                    i < lines.length;
                    i++
                ) {
                    const line = lines[i].trim();

                    if (line.startsWith('#EXTINF:')) {

                        const chnoMatch =
                            line.match(
                                /tvg-chno="([^"]+)"/
                            );

                        const logoMatch =
                            line.match(
                                /tvg-logo="([^"]+)"/
                            );

                        const nameParts =
                            line.split(',');

                        currentChannel = {
                            dial: chnoMatch
                                ? chnoMatch[1]
                                : (channels.length + 101),

                            logo: logoMatch
                                ? logoMatch[1]
                                : 'placeholder.com',

                            name: nameParts[
                                nameParts.length - 1
                            ].trim()
                        };

                    } else if (
                        line.startsWith('http') &&
                        currentChannel
                    ) {
                        currentChannel.url = line;

                        channels.push(currentChannel);

                        currentChannel = null;
                    }
                }

                // Generar los elementos del menú lateral
                const boxList =
                    document.getElementById('box-list');

                boxList.innerHTML = '';

                channels.forEach((channel, idx) => {

                    const row =
                        document.createElement('div');

                    row.className = 'list-row';

                    row.id =
                        `row-${channel.dial}`;

                    row.innerHTML = `
                        <div class="list-num">
                            ${channel.dial}
                        </div>

                        <img
                            class="list-logo"
                            src="${channel.logo}"
                            onerror="this.src='https://placeholder.com'"
                        >

                        <div class="list-name">
                            ${channel.name}
                        </div>
                    `;

                    row.addEventListener(
                        'click',
                        () => {
                            sintonizar(idx);

                            document
                                .getElementById('panel')
                                .classList.remove('open');
                        }
                    );

                    boxList.appendChild(row);
                });

                // Carga inicial
                sintonizar(0);

            } catch (e) {
                console.error(
                    "Error cargando el catálogo.",
                    e
                );
            }
        }

        // Eventos de interfaz interactiva
        document
            .getElementById('zap-prev')
            .addEventListener(
                'click',
                () => sintonizar(currentIndex - 1)
            );

        document
            .getElementById('zap-next')
            .addEventListener(
                'click',
                () => sintonizar(currentIndex + 1)
            );

        document
            .getElementById('open-menu')
            .addEventListener(
                'click',
                () =>
                    document
                        .getElementById('panel')
                        .classList.add('open')
            );

        document
            .getElementById('close-menu')
            .addEventListener(
                'click',
                () =>
                    document
                        .getElementById('panel')
                        .classList.remove('open')
            );

        window.addEventListener(
            'DOMContentLoaded',
            loadTVCOM
        );
    </script>

</body>
</html>
