<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TVCOM - Televisión Pura</title>
    <style>
        :root {
            --glass-bg: rgba(10, 10, 15, 0.6);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent: #ff002b;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            user-select: none;
        }

        /* CONTENEDOR CONTROLES Y VIDEO */
        .fullscreen-theater {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* CONTROLES PERSONALIZADOS PROPIOS DEL PLAYER */
        .custom-player-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 60%, rgba(0,0,0,0));
            z-index: 8;
            padding: 20px 40px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: space-between;
            opacity: 0; /* Ocultos por defecto */
            transition: opacity 0.3s ease;
        }

        /* Mostrar controles al mover el ratón sobre el teatro */
        .fullscreen-theater:hover .custom-player-controls {
            opacity: 1;
        }

        .player-ctrl-left, .player-ctrl-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .player-icon-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.8);
            cursor: pointer;
            padding: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }

        .player-icon-btn:hover {
            color: var(--accent);
        }

        .player-icon-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        /* Barra de volumen estilizada */
        .volume-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .volume-slider {
            -webkit-appearance: none;
            width: 80px;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            transition: background 0.2s;
        }

        .volume-slider::-webkit-slider-thumb:hover {
            background: var(--accent);
        }

        /* BOTONES FLOTANTES DE ZAPEO (FLECHAS TRANSPARENTES) */
        .zap-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 5;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            color: rgba(255, 255, 255, 0.7);
            width: 55px;
            height: 75px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            border-radius: 0 10px 10px 0;
            opacity: 0;
        }
        .fullscreen-theater:hover ~ .zap-btn, .zap-btn:hover {
            opacity: 1;
        }
        .zap-btn:hover {
            background: rgba(255, 0, 43, 0.35);
            color: #fff;
            box-shadow: 0 0 20px rgba(255, 0, 43, 0.4);
        }
        .zap-btn svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }
        #zap-next { right: 0; border-radius: 10px 0 0 10px; }

        .menu-trigger {
            position: absolute;
            top: 25px;
            right: 25px;
            z-index: 5;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            color: white;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            opacity: 0;
        }
        .fullscreen-theater:hover ~ .menu-trigger, .menu-trigger:hover {
            opacity: 1;
        }
        .menu-trigger:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--accent);
            transform: scale(1.05);
        }
        .menu-trigger svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .channel-overlay-banner {
            position: absolute;
            bottom: 90px; /* Subido un poco para no chocar con la barra del player */
            left: 50%;
            transform: translateX(-50%) translateY(30px);
            z-index: 6;
            background: rgba(10, 10, 15, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            padding: 15px 35px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            gap: 20px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }
        .channel-overlay-banner.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .overlay-logo {
            width: 50px;
            height: 50px;
            object-fit: contain;
            background: #000;
            border-radius: 6px;
            padding: 4px;
        }
        .overlay-num { font-size: 26px; font-weight: 800; color: var(--accent); }
        .overlay-title { font-size: 18px; font-weight: 700; white-space: nowrap; }

        .side-panel {
            position: absolute;
            top: 0;
            right: -360px;
            width: 340px;
            height: 100%;
            background: rgba(8, 8, 12, 0.85);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-left: 1px solid var(--glass-border);
            z-index: 10;
            transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            padding: 30px 20px;
        }
        .side-panel.open { right: 0; }
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .panel-header h2 { margin: 0; font-size: 22px; font-weight: 900; letter-spacing: 2px; color: var(--accent); }
        .close-panel { cursor: pointer; color: rgba(255,255,255,0.6); display: flex; align-items: center; }
        .close-panel svg { width: 22px; height: 22px; fill: currentColor; }
        
        .channel-list-scroller {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .channel-list-scroller::-webkit-scrollbar { width: 4px; }
        .channel-list-scroller::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }

        .list-row {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }
        .list-row:hover { background: rgba(255,255,255,0.06); }
        .list-row.active {
            background: rgba(255, 0, 43, 0.15);
            border-color: var(--accent);
        }
        .list-num { font-size: 14px; font-weight: 800; color: rgba(255,255,255,0.25); width: 32px; text-align: center; }
        .list-row.active .list-num { color: var(--accent); }
        .list-logo { width: 38px; height: 38px; object-fit: contain; background: #000; border-radius: 6px; padding: 3px; }
        .list-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .category-header {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent);
            padding: 15px 10px 5px 10px;
            margin-top: 10px;
            border-bottom: 1px solid rgba(255, 0, 43, 0.15);
            opacity: 0.8;
        }
        
        /* Ajuste para que la primera categoría no quede muy pegada arriba */
        .category-header:first-of-type {
            margin-top: 0;
        }

    </style>
</head>

<body>

    <!-- REPRODUCTOR MÁSTER A PANTALLA COMPLETA CON CONTROLES NATIVOS OCULTOS -->
    <div class="fullscreen-theater" id="theater">
        <video id="video" autoplay muted></video>

        <!-- NUEVA BARRA DE CONTROLES FLOTANTE Y STYLISH -->
        <div class="custom-player-controls">
            <div class="player-ctrl-left">
                <!-- Botón Play / Pausa -->
                <button class="player-icon-btn" id="play-pause-btn">
                    <svg id="play-icon" viewBox="0 0 24 24" style="display:none;"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="pause-icon" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
                <!-- Control de Volumen -->
                <div class="volume-container">
                    <button class="player-icon-btn" id="mute-btn">
                        <svg id="volume-on-icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
                        <svg id="volume-off-icon" viewBox="0 0 24 24" style="display:none;"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.21.05-.42.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
                    </button>
                    <input type="range" class="volume-slider" id="volume-bar" min="0" max="1" step="0.1" value="0">
                </div>
            </div>

            <div class="player-ctrl-right">
                <!-- Botón Pantalla Completa Nativa -->
                <button class="player-icon-btn" id="full-screen-btn">
                    <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- BOTONES FLOTANTES DE ZAPEO -->
    <div class="zap-btn" id="zap-prev">
        <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
    </div>
    <div class="zap-btn" id="zap-next">
        <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
    </div>
    
    <!-- BOTÓN DE MENÚ -->
    <div class="menu-trigger" id="open-menu">
        <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
    </div>

    <!-- BANNER TEMPORAL DE ZAPEO (OSD) -->
    <div class="channel-overlay-banner" id="osd">
        <div class="overlay-num" id="osd-num">---</div>
        <div id="osd-logo-box"></div>
        <div class="overlay-title" id="osd-name">Cargando...</div>
    </div>

    <!-- MENÚ LATERAL TRANSLÚCIDO -->
    <div class="side-panel" id="panel">
        <div class="panel-header">
            <h2>TVCOM</h2>
            <div class="close-panel" id="close-menu">
                <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            </div>
        </div>
        <div class="channel-list-scroller" id="box-list"></div>
    </div>

    <!-- ENLACE OFICIAL AL MOTOR DE VIDEO HLS -->
    <script src="https://cloudflare.com"></script>

    <script>
        const m3uUrl = 'lista.m3u?v=' + Math.random();
        const video = document.getElementById('video');
        const theater = document.getElementById('theater');
        let channels = [];
        let currentIndex = 0;
        let hlsInstance = null;
        let osdTimeout = null;

        const playPauseBtn = document.getElementById('play-pause-btn');
        const playIcon = document.getElementById('play-icon');
        const pauseIcon = document.getElementById('pause-icon');
        const muteBtn = document.getElementById('mute-btn');
        const volumeOnIcon = document.getElementById('volume-on-icon');
        const volumeOffIcon = document.getElementById('volume-off-icon');
        const volumeBar = document.getElementById('volume-bar');
        const fullScreenBtn = document.getElementById('full-screen-btn');

        playPauseBtn.addEventListener('click', () => {
            if (video.paused) {
                video.play();
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
            } else {
                video.pause();
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
            }
        });

        muteBtn.addEventListener('click', () => {
            video.muted = !video.muted;
            if (video.muted) {
                volumeOnIcon.style.display = 'none';
                volumeOffIcon.style.display = 'block';
                volumeBar.value = 0;
            } else {
                volumeOnIcon.style.display = 'block';
                volumeOffIcon.style.display = 'none';
                volumeBar.value = video.volume || 0.5;
            }
        });

        volumeBar.addEventListener('input', (e) => {
            video.volume = e.target.value;
            if (video.volume == 0) {
                video.muted = true;
                volumeOnIcon.style.display = 'none';
                volumeOffIcon.style.display = 'block';
            } else {
                video.muted = false;
                volumeOnIcon.style.display = 'block';
                volumeOffIcon.style.display = 'none';
            }
        });

        fullScreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                if (theater.requestFullscreen) theater.requestFullscreen();
                else if (theater.webkitRequestFullscreen) theater.webkitRequestFullscreen();
                else if (theater.msRequestFullscreen) theater.msRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        });

        function triggerOSD(channel) {
            document.getElementById('osd-num').innerText = channel.dial;
            document.getElementById('osd-name').innerText = channel.name;
            const logoBox = document.getElementById('osd-logo-box');
            if (channel.logo) {
                logoBox.innerHTML = `<img class="overlay-logo" src="${channel.logo}" onerror="this.style.display='none'">`;
            } else {
                logoBox.innerHTML = '';
            }
            
            const osd = document.getElementById('osd');
            osd.classList.add('show');
            clearTimeout(osdTimeout);
            osdTimeout = setTimeout(() => osd.classList.remove('show'), 3000);
        }

        function sintonizar(index) {
            if (channels.length === 0) return;
            if (index < 0) index = channels.length - 1;
            if (index >= channels.length) index = 0;
            
            currentIndex = index;
            const channel = channels[currentIndex];
            
            triggerOSD(channel);

            document.querySelectorAll('.list-row').forEach(r => r.classList.remove('active'));
            const activeRow = document.getElementById(`row-${channel.dial}`);
            if (activeRow) activeRow.classList.add('active');

            if (typeof Hls !== 'undefined' && Hls.isSupported()) {
                if (hlsInstance) hlsInstance.destroy();
                hlsInstance = new Hls();
                hlsInstance.loadSource(channel.url);
                hlsInstance.attachMedia(video);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(() => {
                        playIcon.style.display = 'block';
                        pauseIcon.style.display = 'none';
                    });
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = channel.url;
                video.play().catch(() => {
                    playIcon.style.display = 'block';
                    pauseIcon.style.display = 'none';
                });
            }
            
            if (!video.paused) {
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
            }
        }

        async function loadTVCOM() {
            try {
                const response = await fetch(m3uUrl);
                const text = await response.text();
                const lines = text.split('\n');
                
                let currentName = "";
                let currentDial = "";
                let currentLogo = "";
                let currentGroup = "";

                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i].trim();
                    
                    if (line.startsWith('#EXTINF:')) {
                        currentName = "Canal";
                        currentDial = (channels.length + 101).toString();
                        currentLogo = "";
                        currentGroup = "Otros Canales"; // Categoría por defecto si no tiene

                        if (line.includes(',')) {
                            currentName = line.substring(line.lastIndexOf(',') + 1).trim();
                        }

                        const chMatch = line.match(/tvg-chno="([^"]+)"/);
                        if (chMatch) currentDial = chMatch[1];

                        const logoMatch = line.match(/tvg-logo="([^"]+)"/);
                        if (logoMatch) currentLogo = logoMatch[1];

                        // Extraemos la categoría (group-title) del M3U
                        const groupMatch = line.match(/group-title="([^"]+)"/);
                        if (groupMatch) currentGroup = groupMatch[1];
                    } 
                    else if (line.startsWith('http')) {
                        channels.push({
                            dial: currentDial,
                            logo: currentLogo,
                            name: currentName,
                            group: currentGroup,
                            url: line
                        });
                    }
                }

                const boxList = document.getElementById('box-list');
                boxList.innerHTML = '';
                
                if (channels.length === 0) {
                    boxList.innerHTML = '<div style="padding:20px;color:#ff3355;">Sin canales</div>';
                    return;
                }

                let lastGroup = "";

                channels.forEach((channel, idx) => {
                    // Si el grupo de este canal cambia respecto al anterior, inyectamos un separador visual
                    if (channel.group !== lastGroup) {
                        const header = document.createElement('div');
                        header.className = 'category-header';
                        header.innerText = channel.group;
                        boxList.appendChild(header);
                        lastGroup = channel.group;
                    }

                    const row = document.createElement('div');
                    row.className = 'list-row';
                    row.id = `row-${channel.dial}`;
                    
                    const logoHtml = channel.logo ? 
                        `<img class="list-logo" src="${channel.logo}" onerror="this.style.display='none'">` : 
                        `<div class="list-logo" style="display:flex;align-items:center;justify-content:center;background:#222;font-size:10px;font-weight:bold;">TV</div>`;

                    row.innerHTML = `
                        <div class="list-num">${channel.dial}</div>
                        ${logoHtml}
                        <div class="list-name">${channel.name}</div>
                    `;
                    row.addEventListener('click', () => {
                        sintonizar(idx);
                        document.getElementById('panel').classList.remove('open');
                    });
                    boxList.appendChild(row);
                });

                video.muted = true;
                volumeBar.value = 0;
                volumeOnIcon.style.display = 'none';
                volumeOffIcon.style.display = 'block';
                sintonizar(0);

            } catch (e) {
                document.getElementById('box-list').innerHTML = '<div style="padding:20px;color:#ff3355;">Error de red</div>';
                console.error(e);
            }
        }

        document.getElementById('zap-prev').addEventListener('click', () => sintonizar(currentIndex - 1));
        document.getElementById('zap-next').addEventListener('click', () => sintonizar(currentIndex + 1));
        document.getElementById('open-menu').addEventListener('click', () => document.getElementById('panel').classList.add('open'));
        document.getElementById('close-menu').addEventListener('click', () => document.getElementById('panel').classList.remove('open'));

        window.addEventListener('DOMContentLoaded', loadTVCOM);
    </script>
</body>
</html>
