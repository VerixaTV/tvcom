<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TVCOM - Tu Televisión Abierta y Gratis</title>
    <!-- Cargamos el reproductor de video HLS para que funcione el streaming -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body {
            background-color: #111;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            width: 100%;
            background-color: #000;
            padding: 15px 0;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #e50914; /* Rojo estilo TV */
            border-bottom: 2px solid #222;
        }
        #player-container {
            width: 100%;
            max-width: 800px;
            margin: 20px 0;
            background-color: black;
            aspect-ratio: 16/9;
        }
        video {
            width: 100%;
            height: 100%;
        }
        #channels-container {
            width: 90%;
            max-width: 800px;
            background-color: #1a1a1a;
            border-radius: 8px;
            padding: 15px;
            box-sizing: border-box;
            max-height: 400px;
            overflow-y: auto;
        }
        .channel-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #333;
            cursor: pointer;
            transition: background 0.2s;
        }
        .channel-item:hover {
            background-color: #333;
        }
        .channel-logo {
            width: 45px;
            height: 45px;
            object-fit: contain;
            margin-right: 15px;
            background: #222;
            border-radius: 4px;
        }
        .channel-info {
            display: flex;
            flex-direction: column;
        }
        .channel-name {
            font-weight: bold;
            font-size: 16px;
        }
        .channel-dial {
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>

    <header>TVCOM</header>

    <div id="player-container">
        <video id="video" controls autoplay muted></video>
    </div>

    <div id="channels-container">
        <h3>Guía de Canales</h3>
        <div id="playlist">Cargando canales de TVCOM...</div>
    </div>

    <script>
        // Aquí conectamos directamente con tu lista de Rentry
        const m3uUrl = 'lista.m3u';
        const video = document.getElementById('video');
        const playlistContainer = document.getElementById('playlist');

        // Función para reproducir el canal seleccionado
        function playChannel(url) {
            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play();
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('loadedmetadata', function() {
                    video.play();
                });
            }
        }

        // Función para procesar el archivo M3U de Rentry
        async function loadPlaylist() {
            try {
                const response = await fetch(m3uUrl);
                const text = await response.text();
                
                const lines = text.split('\n');
                let channels = [];
                let currentChannel = {};

                lines.forEach(line => {
                    if (line.startsWith('#EXTINF:')) {
                        // Extraer el dial (tvg-chno)
                        const chnoMatch = line.match(/tvg-chno="([^"]+)"/);
                        // Extraer el logo (tvg-logo)
                        const logoMatch = line.match(/tvg-logo="([^"]+)"/);
                        // Extraer el nombre del canal
                        const nameParts = line.split(',');
                        const name = nameParts[nameParts.length - 1].trim();

                        currentChannel = {
                            dial: chnoMatch ? chnoMatch[1] : '',
                            logo: logoMatch ? logoMatch[1] : 'https://placeholder.com',
                            name: name
                        };
                    } else if (line.startsWith('http')) {
                        currentChannel.url = line.trim();
                        channels.push(currentChannel);
                        currentChannel = {};
                    }
                });

                // Dibujar los canales en la web
                playlistContainer.innerHTML = '';
                channels.forEach((channel, index) => {
                    const item = document.createElement('div');
                    item.className = 'channel-item';
                    item.innerHTML = `
                        <img class="channel-logo" src="${channel.logo}" alt="${channel.name}">
                        <div class="channel-info">
                            <span class="channel-name">${channel.name}</span>
                            <span class="channel-dial">Dial ${channel.dial}</span>
                        </div>
                    `;
                    item.addEventListener('click', () => playChannel(channel.url));
                    playlistContainer.appendChild(item);

                    // Reproducir el primer canal automáticamente al cargar la web
                    if (index === 0) {
                        playChannel(channel.url);
                    }
                });

            } catch (error) {
                playlistContainer.innerHTML = 'Error al conectar con el servidor de TVCOM.';
                console.error(error);
            }
        }

        loadPlaylist();
    </script>
</body>
</html>
