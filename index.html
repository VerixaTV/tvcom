<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TVCOM - Experiencia de Televisión Inmersiva</title>
    <style>
        :root {
            --glow-color: #ff002b;
            --glass-bg: rgba(20, 20, 30, 0.75);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-sec: #a1a1aa;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050508;
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            overflow: hidden;
        }

        /* CABECERA FLOTANTE */
        .brand-header {
            position: absolute;
            top: 25px;
            left: 35px;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .brand-logo {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(45deg, #ff002b, #ff6b81);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 0, 43, 0.3);
        }

        .badge-live {
            background: rgba(255, 0, 43, 0.2);
            border: 1px solid var(--glow-color);
            color: #ff3355;
            font-size: 10px;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(255, 0, 43, 0.2);
        }

        /* CONTENEDOR TEATRO */
        .theater-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2;
            box-sizing: border-box;
            padding-bottom: 160px;
        }

        .screen-wrapper {
            position: relative;
            width: 60%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 30px 100px rgba(0, 0, 0, 0.8), 0 0 80px rgba(255, 0, 43, 0.1);
            border: 1px solid var(--glass-border);
            transition: all 0.4s ease;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* TARJETA INFORMATIVA */
        .info-card {
            margin-top: 25px;
            width: 60%;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 15px 25px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .meta-left {
            display: flex;
            align-items: center;
            gap: 20px;
            overflow: hidden;
        }

        .meta-logo {
            width: 50px;
            height: 50px;
            object-fit: contain;
            background: rgba(0,0,0,0.4);
            border-radius: 8px;
            padding: 5px;
            border: 1px solid rgba(255,255,255,0.05);
            flex-shrink: 0;
        }

        .meta-text {
            overflow: hidden;
        }

        .meta-text .channel-title {
            font-size: 12px;
            color: #ff3355;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }

        .meta-text .program-title {
            font-size: 18px;
            font-weight: bold;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .clock-live {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-sec);
            background: rgba(255,255,255,0.05);
            padding: 5px 12px;
            border-radius: 8px;
            border: 1px solid var(--glass-border);
            flex-shrink: 0;
        }

        /* CINTA DE DIALES HORIZONTAL INFERIOR */
        .carousel-section {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 160px;
            background: linear-gradient(to top, #050508 80%, rgba(5,5,8,0));
            z-index: 5;
            display: flex;
            align-items: center;
            padding: 0 40px;
            box-sizing: border-box;
        }

        .carousel-track {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            width: 100%;
            padding: 15px 0;
            scroll-behavior: smooth;
        }

        .carousel-track::-webkit-scrollbar {
            height: 5px;
        }

        .carousel-track::-webkit-scrollbar-thumb {
            background: rgba(255, 0, 43, 0.4);
            border-radius: 10px;
        }

        .dial-card {
            flex: 0 0 240px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: all 0.25s ease;
            user-select: none;
            overflow: hidden;
        }

        .dial-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 0, 43, 0.4);
        }

        .dial-card.active {
            background: rgba(255, 0, 43, 0.12);
            border-color: var(--glow-color);
            box-shadow: 0 0 25px rgba(255, 0, 43, 0.2);
        }

        .dial-num {
            font-size: 22px;
            font-weight: 800;
            color: rgba(255,255,255,0.12);
        }

        .dial-card.active .dial-num {
            color: #ff3355;
        }

        .card-thumb {
            width: 45px;
            height: 45px;
            object-fit: contain;
            background: #000;
            border-radius: 6px;
            padding: 3px;
            flex-shrink: 0;
        }

        .card-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .card-ch-name {
            font-weight: bold;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-epg-info {
            font-size: 12px;
            color: var(--text-sec);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }

        @media (max-width: 1024px) {
            .screen-wrapper, .info-card {
                width: 90%;
            }
        }
    </style>
</head>
<body>

    <div class="brand-header">
        <div class="brand-logo">TVCOM</div>
        <div class="badge-live">En Directo</div>
    </div>

    <div class="theater-container">
        <div class="screen-wrapper">
            <video id="video" controls autoplay muted></video>
        </div>

        <div class="info-card">
            <div class="meta-left">
                <img id="now-logo" class="meta-logo" src="https://placeholder.com" alt="Logo">
                <div class="meta-text">
                    <div id="now-dial-name" class="channel-title">Sintonizando...</div>
                    <div id="now-program" class="program-title">Cargando canales de TVCOM...</div>
                </div>
            </div>
            <div class="clock-live" id="live-clock">00:00:00</div>
        </div>
    </div>

    <div class="carousel-section">
        <div id="carousel-track" class="carousel-track">
            <!-- Diales dinámicos -->
        </div>
    </div>

    <!-- CARGA DE SEGURIDAD RESPALDO: Motor integrado directo y rápido de cdnjs libre de fallos -->
    <script src="https://cloudflare.com"></script>

    <script>
        const m3uUrl = 'lista.m3u';
        const video = document.getElementById('video');
        const trackContainer = document.getElementById('carousel-track');
        let hlsInstance = null;

        function startClock() {
            setInterval(() => {
                document.getElementById('live-clock').innerText =
                    new Date().toLocaleTimeString();
            }, 1000);
        }

        function generateEPG(name, dial) {
            const hora = new Date().getHours();
            const numDial = parseInt(dial);

            if (numDial >= 100 && numDial < 200) {
                if (hora >= 6 && hora < 14)
                    return "Informativo Matinal de Actualidad";

                if (hora >= 14 && hora < 20)
                    return "Conexión en Directo y Debate de Tarde";

                return "Telediario Nocturno y Crónica de Cierre";
            }

            if (numDial >= 200 && numDial < 300)
                return "Cine: Película de Ficción Temática [24/7]";

            if (numDial >= 300 && numDial < 400)
                return "Retransmisión Deportiva y Entrevistas";

            return "Emisión Lineal Oficial Continua";
        }

        function playChannel(url, name, logo, dial) {
            const epgText = generateEPG(name, dial);

            document.getElementById('now-dial-name').innerText =
                `Dial ${dial} • ${name}`;

            document.getElementById('now-logo').src = logo;
            document.getElementById('now-program').innerText = epgText;

            document.querySelectorAll('.dial-card').forEach(card =>
                card.classList.remove('active')
            );

            const selectedCard = document.getElementById(`card-${dial}`);

            if (selectedCard) {
                selectedCard.classList.add('active');

                selectedCard.scrollIntoView({
                    behavior: 'smooth',
                    block: 'nearest',
                    inline: 'center'
                });
            }

            if (typeof Hls !== 'undefined' && Hls.isSupported()) {
                if (hlsInstance) hlsInstance.destroy();

                hlsInstance = new Hls();
                hlsInstance.loadSource(url);
                hlsInstance.attachMedia(video);

                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () =>
                    video.play().catch(() => {})
                );

            } else if (
                video.canPlayType('application/vnd.apple.mpegurl')
            ) {
                video.src = url;
                video.play().catch(() => {});
            }
        }

        async function loadTVCOM() {
            try {
                const response = await fetch(m3uUrl);
                const text = await response.text();
                const lines = text.split('\n');

                let channels = [];
                let currentChannel = null;

                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i].trim();

                    if (line.startsWith('#EXTINF:')) {
                        const chnoMatch =
                            line.match(/tvg-chno="([^"]+)"/);

                        const logoMatch =
                            line.match(/tvg-logo="([^"]+)"/);

                        const nameParts = line.split(',');
                        const name =
                            nameParts[nameParts.length - 1].trim();

                        currentChannel = {
                            dial: chnoMatch
                                ? chnoMatch[1]
                                : (channels.length + 101),

                            logo: logoMatch
                                ? logoMatch[1]
                                : 'placeholder.com',

                            name: name
                        };

                    } else if (
                        line.startsWith('http') &&
                        currentChannel
                    ) {
                        currentChannel.url = line;
                        channels.push(currentChannel);
                        currentChannel = null;
                    }
                }

                trackContainer.innerHTML = '';

                channels.forEach((channel, index) => {
                    const epgInfo =
                        generateEPG(
                            channel.name,
                            channel.dial
                        );

                    const card =
                        document.createElement('div');

                    card.className = 'dial-card';

                    card.id = `card-${channel.dial}`;

                    card.innerHTML = `
                        <div class="dial-num">
                            ${channel.dial}
                        </div>

                        <img
                            class="card-thumb"
                            src="${channel.logo}"
                            onerror="this.src='https://placeholder.com'"
                        >

                        <div class="card-info">
                            <div class="card-ch-name">
                                ${channel.name}
                            </div>

                            <div class="card-epg-info">
                                ${epgInfo}
                            </div>
                        </div>
                    `;

                    card.addEventListener('click', () =>
                        playChannel(
                            channel.url,
                            channel.name,
                            channel.logo,
                            channel.dial
                        )
                    );

                    trackContainer.appendChild(card);

                    if (index === 0) {
                        playChannel(
                            channel.url,
                            channel.name,
                            channel.logo,
                            channel.dial
                        );
                    }
                });

            } catch (error) {
                trackContainer.innerHTML =
                    'Error al enlazar lista.m3u';
            }
        }

        startClock();

        window.addEventListener(
            'DOMContentLoaded',
            loadTVCOM
        );
    </script>

</body>
</html>
